name: Deploy Astro Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install git-crypt
        run: sudo apt-get update && sudo apt-get install -y git-crypt

      - name: Unlock git-crypt
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if [ -n "$GIT_CRYPT_KEY" ]; then
            echo "$GIT_CRYPT_KEY" | base64 -d > ./git-crypt-key
            git-crypt unlock ./git-crypt-key
            rm -f ./git-crypt-key
            echo "git-crypt unlocked successfully."
          else
            echo "::warning::GIT_CRYPT_KEY secret is not set in repository settings! Build may fail if content is encrypted."
          fi

      - name: Build Astro Site
        run: npm run build

      - name: Encrypt Protected Pages
        run: npm run encrypt
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
